
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickSave</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div>
      <h1>QuickSave</h1>
      <p>Your personal reading space.</p>
    </div>
    <span class="logo">Q</span>
  </header>

  <section class="save-section">
    <h3>Save Current Page</h3>

    <select id="categoryInput">
      <option value="">Uncategorized</option>
    </select>

    <button id="saveBtn" class="primary-btn">
      + Save Page
    </button>

    <p id="message"></p>
  </section>

  <section class="collections-section">

    <div class="section-heading">
      <h3>My Collections</h3>
      <button id="addCategoryBtn" class="add-btn">+ New</button>
    </div>

    <div id="collectionsList"></div>

  </section>

  <section class="pages-section">

    <div class="section-heading">
      <h3 id="pageHeading">All Saved Pages</h3>
    </div>

    <input
      type="text"
      id="searchInput"
      placeholder="Search your saved pages..."
    >

    <div id="pagesList"></div>

  </section>

  <script src="popup.js"></script>

</body>
</html>
